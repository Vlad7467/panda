э<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мамкин Скамер | Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #09090b; --surface: #121215; --surface2: #1a1a1f;
    --line: rgba(255, 255, 255, 0.08); --accent: #22c55e;
    --accent-glow: rgba(34, 197, 94, 0.15); --text: #f4f4f5;
    --text-dim: #a1a1aa; --danger: #ff3355;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 420px; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 42px; height: 42px; background: var(--surface2); border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .status-badge { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: all 0.3s; }
  .status-badge.online { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(34,197,94,0.3); }
  .status-badge.offline { background: rgba(255,51,85,0.1); color: var(--danger); border: 1px solid rgba(255,51,85,0.3); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-badge.online .dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .data-grid { display: flex; gap: 32px; }
  .data-item .val { font-family: var(--mono); font-size: 20px; font-weight: 700; transition: color 0.3s; }
  .data-item .lbl { font-size: 11px; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn { width: 100%; padding: 16px; background: var(--text); color: #000; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform 0.1s, opacity 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .keys-section { display: none; margin-top: 16px; animation: fadeIn 0.3s ease; }
  .keys-section.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .key-card { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .key-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
  .key-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }
  .key-val { font-family: var(--mono); font-size: 10px; color: var(--accent); word-break: break-all; background: #000; padding: 12px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 12px; max-height: 80px; overflow-y: auto; line-height: 1.5; user-select: all; }
  .copy-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; width: 100%; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
  .copy-btn:active { background: var(--line); }
  #error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; font-weight: 500; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">🕶️</div>
    <div class="title">Мамкин Скамер</div>
  </div>
  <div class="card">
    <div class="status-row">
      <div style="font-size: 14px; font-weight: 600;">Статус подписки</div>
      <div id="status-badge" class="status-badge offline"><span class="dot"></span> ЗАГРУЗКА</div>
    </div>
    <div class="data-grid">
      <div class="data-item"><div class="val" id="expiry">—</div><div class="lbl">Действует до</div></div>
      <div class="data-item"><div class="val" id="traffic">0 MB</div><div class="lbl">Скачано</div></div>
    </div>
  </div>
  <button class="btn" id="getKeysBtn">Достать ключи</button>
  <p id="error"></p>
  <div class="keys-section" id="keysSection">
    <div class="key-card">
      <div class="key-header"><span>VLESS Reality</span><span style="color: var(--text-dim)">Соцсети / 4K</span></div>
      <div class="key-desc">Для YouTube, Telegram и обхода блокировок</div>
      <div class="key-val" id="key-vless">Загрузка...</div>
      <button class="copy-btn" data-key="vless">Копировать ключ</button>
    </div>
    <div class="key-card">
      <div class="key-header"><span>Hysteria2</span><span style="color: var(--text-dim)">Игры / UDP</span></div>
      <div class="key-desc">Для eFootball и минимального пинга</div>
      <div class="key-val" id="key-hy2">Загрузка...</div>
      <button class="copy-btn" data-key="hy2">Копировать ключ</button>
    </div>
  </div>
</div>
<script>
  const tg = window.Telegram?.WebApp;
  // ВСТАВЬ ССЫЛКУ ИЗ CLOUDFLARE TUNNEL
  const API = "https://ТВОЯ_ССЫЛКА.trycloudflare.com"; 

  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#09090b'); tg.setBackgroundColor('#09090b'); }

  function formatTraffic(bytes) {
    if (!bytes || bytes === 0) return "0 MB";
    const gb = bytes / (1024 ** 3);
    if (gb >= 1) return gb.toFixed(2) + " GB";
    return (bytes / (1024 ** 2)).toFixed(1) + " MB";
  }

  function formatDate(iso) {
    if (!iso || iso === "forever") return "∞ Навсегда";
    try { const d = new Date(iso); return isNaN(d.getTime()) ? "—" : d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch { return "—"; }
  }

  async function loadStatus() {
    try {
      const res = await fetch(`${API}/api/status?initData=${encodeURIComponent(tg?.initData || '')}`);
      if (!res.ok) throw new Error("status");
      const data = await res.json();
      const badge = document.getElementById("status-badge");
      if (data.active) {
        badge.className = "status-badge online";
        badge.innerHTML = '<span class="dot"></span> ONLINE';
        document.getElementById("expiry").textContent = formatDate(data.expiry);
      } else {
        badge.className = "status-badge offline";
        badge.innerHTML = '<span class="dot"></span> OFFLINE';
        document.getElementById("expiry").textContent = "—";
      }
      document.getElementById("traffic").textContent = formatTraffic((data.traffic_gb || 0) * 1024 ** 3);
      document.getElementById("error").textContent = "";
    } catch { document.getElementById("error").textContent = "Сервер не отвечает"; }
  }

  document.getElementById("getKeysBtn").onclick = async () => {
    const btn = document.getElementById("getKeysBtn"), err = document.getElementById("error");
    err.textContent = ""; btn.disabled = true; btn.textContent = "Загрузка...";
    try {
      const res = await fetch(`${API}/api/keys?initData=${encodeURIComponent(tg?.initData || '')}`);
      const data = await res.json();
      if (!res.ok) { err.textContent = "Нет активной подписки. Иди в бота."; btn.disabled = false; btn.textContent = "Достать ключи"; return; }
      document.getElementById("key-vless").textContent = data.vless || "Ошибка VLESS";
      document.getElementById("key-hy2").textContent = data.hy2 || "Ошибка Hysteria2";
      document.getElementById("keysSection").classList.add("show");
      btn.textContent = "Ключи ниже 👇";
    } catch { err.textContent = "Ошибка сервера."; btn.disabled = false; btn.textContent = "Достать ключи"; }
  };

  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.onclick = () => {
      const text = document.getElementById("key-" + btn.dataset.key).textContent;
      if (!text || text.startsWith("Ошибка") || text === "Загрузка...") return;
      const done = () => { btn.textContent = "✓ Скопировано"; setTimeout(() => btn.textContent = "Копировать ключ", 2000); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => {});
      else { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done(); }
    };
  });

  loadStatus();
  setInterval(loadStatus, 30000);
</script>
</body>
</html>
