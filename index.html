<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мамкин Скамер | Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#09090b; --surface:#121215; --surface-2:#1a1a1f;
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.16);
  --text-primary:#f4f4f5; --text-secondary:#a1a1aa;
  --success:#22c55e; --danger:#ff3355; --warn:#f59e0b; --accent:#00d4ff;
  --purple:#9c7cff;
  --font-main:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font-main); background:var(--bg); color:var(--text-primary); min-height:100vh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
.app-container { width:100%; max-width:440px; padding:24px 20px; display:flex; flex-direction:column; gap:16px; }

.header { display:flex; align-items:center; gap:14px; padding-bottom:8px; }
.logo-icon { width:48px; height:48px; background:var(--surface-2); border-radius:14px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; }
.brand-title { font-size:22px; font-weight:700; letter-spacing:-.6px; }

.glass-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
.status-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.status-title { font-size:15px; font-weight:600; }
.status-pill { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:6px 12px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); text-transform:uppercase; letter-spacing:.5px; }
.status-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.status-pill.online { color:var(--success); border-color:rgba(34,197,94,.3); background:rgba(34,197,94,.1); }
.status-pill.offline { color:var(--danger); border-color:rgba(255,51,85,.3); background:rgba(255,51,85,.1); }
.status-pill.loading { color:var(--text-secondary); }
.status-pill.error { color:var(--warn); border-color:rgba(245,158,11,.3); background:rgba(245,158,11,.1); }
.status-pill.online .status-dot { box-shadow:0 0 8px var(--success); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.metric-item { display:flex; flex-direction:column; gap:6px; }
.metric-value { font-family:var(--font-mono); font-size:20px; font-weight:700; letter-spacing:-.5px; }
.metric-label { font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; }

.btn-primary { width:100%; padding:16px; background:var(--text-primary); color:#000; border:none; border-radius:14px; font-family:var(--font-main); font-size:15px; font-weight:800; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:6px; text-transform:uppercase; letter-spacing:.3px; }
.btn-primary:active { transform:scale(.98); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-secondary { width:100%; padding:12px; background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:14px; font-family:var(--font-main); font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; }
.btn-secondary:active { background:rgba(255,51,85,.1); }

.error-msg { color:var(--danger); font-size:13px; text-align:center; min-height:16px; font-weight:500; padding:0 8px; line-height:1.4; }

.keys-container { display:none; flex-direction:column; gap:16px; animation:slideUp .4s cubic-bezier(.16,1,.3,1); }
.keys-container.show { display:flex; }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

.key-card { background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:18px; position:relative; overflow:hidden; }
.key-card.primary { border-color:rgba(0,212,255,.3); }
.key-card.primary::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
.key-card.game { border-color:rgba(34,197,94,.3); }
.key-card.game::before { content:""; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--success),transparent); }

.key-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:8px; }
.key-name { font-size:14px; font-weight:700; }
.key-badge { font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap; }
.key-badge.primary { background:rgba(0,212,255,.15); color:var(--accent); }
.key-badge.game { background:rgba(34,197,94,.15); color:var(--success); }

.key-data-box { background:#000; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; font-family:var(--font-mono); font-size:10px; color:var(--success); word-break:break-all; line-height:1.6; max-height:90px; overflow-y:auto; user-select:all; }

.key-actions { display:grid; grid-template-columns:1fr; gap:8px; }
.btn-action { width:100%; padding:14px; background:transparent; border:1px solid var(--border); color:var(--text-primary); border-radius:10px; font-family:var(--font-main); font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:6px; }
.btn-action.json-btn { background:rgba(156,124,255,.08); border-color:rgba(156,124,255,.35); color:var(--purple); font-weight:700; display:none; }
.btn-action.json-btn:active { background:rgba(156,124,255,.2); }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--surface-2); border:1px solid var(--border-hover); color:var(--text-primary); padding:12px 20px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; transition:all .3s; z-index:999; pointer-events:none; max-width:90%; text-align:center; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

.modal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
.modal.show { display:flex; }
.modal-content { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:340px; width:100%; text-align:center; }
.modal h3 { font-size:18px; margin-bottom:12px; }
.modal p { font-size:14px; color:var(--text-secondary); line-height:1.5; margin-bottom:24px; }
.modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.btn-modal { width:100%; padding:14px; border-radius:12px; font-family:var(--font-main); font-size:14px; font-weight:600; cursor:pointer; border:none; }
.btn-modal.cancel { background:var(--surface-2); color:var(--text-primary); }
.btn-modal.confirm { background:var(--danger); color:#fff; }
</style>
</head>
<body>
<div class="app-container">
  <header class="header">
    <div class="logo-icon">🕶️</div>
    <div class="brand-title">Мамкин Скамер</div>
  </header>

  <div class="glass-card">
    <div class="status-header">
      <span class="status-title">Статус подписки</span>
      <div id="status-badge" class="status-pill loading"><span class="status-dot"></span> Загрузка</div>
    </div>
    <div class="metrics-grid">
      <div class="metric-item"><span class="metric-value" id="ui-expiry">—</span><span class="metric-label">Действует до</span></div>
      <div class="metric-item"><span class="metric-value" id="ui-traffic">0 MB</span><span class="metric-label">Скачано</span></div>
    </div>
  </div>

  <button class="btn-primary" id="getKeysBtn">Достать ключи</button>
  <button class="btn-secondary" id="reissueBtn" style="margin-top:4px;">🔄 Перевыпустить ключи</button>
  <p class="error-msg" id="error"></p>

  <div class="keys-container" id="keysSection">
    <!-- DE Основной (8443) -->
    <div class="key-card primary">
      <div class="key-header">
        <span class="key-name">🇩🇪 DE Основной (8443)</span>
        <span class="key-badge primary">⚡ Быстрый</span>
      </div>
      <div class="key-data-box" id="key-my_private">Файл конфигурации готов</div>
      <div class="key-actions">
        <button class="btn-action json-btn" id="json-my_private" data-key="my_private">📥 Скачать JSON</button>
      </div>
    </div>

    <!-- RU Игровой (Каскад) -->
    <div class="key-card game">
      <div class="key-header">
        <span class="key-name">🇷🇺 RU Игровой (Каскад)</span>
        <span class="key-badge game">🎮 Низкий пинг</span>
      </div>
      <div class="key-data-box" id="key-relay">Файл конфигурации готов</div>
      <div class="key-actions">
        <button class="btn-action json-btn" id="json-relay" data-key="relay">📥 Скачать JSON</button>
      </div>
    </div>
  </div>

  <div class="modal" id="reissueModal">
    <div class="modal-content">
      <h3>⚠️ Внимание!</h3>
      <p>Перевыпуск ключей удалит текущие профили.<br><br>Вам придётся заново импортировать их в клиенте.</p>
      <div class="modal-actions">
        <button class="btn-modal cancel" id="cancelReissue">Отмена</button>
        <button class="btn-modal confirm" id="confirmReissue">Перевыпустить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';

const API = "https://wild-rain-661e.vladislavmacko2011.workers.dev";
const CACHE_KEY = 'vpn_keys_v6';
const CACHE_TTL = 1000 * 60 * 60 * 6;

const tg = window.Telegram?.WebApp;
try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#09090b'); tg.setBackgroundColor('#09090b'); } } catch(e) {}

const haptic = (t) => { try { if (t === 'impact') tg?.HapticFeedback?.impactOccurred?.('light'); if (t === 'notify') tg?.HapticFeedback?.notificationOccurred?.('success'); if (t === 'error') tg?.HapticFeedback?.notificationOccurred?.('error'); } catch {} };

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text; toast.classList.add("show");
  clearTimeout(window._tt);
  window._tt = setTimeout(() => toast.classList.remove("show"), 2500);
}

async function apiFetch(path) {
  const res = await fetch(`${API}${path}`, { cache: 'no-store' });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { throw new Error('Ошибка протокола'); }
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

function formatTraffic(bytes) {
  const n = Number(bytes) || 0; if (n <= 0) return "0 MB";
  const gb = n / (1024 ** 3); if (gb >= 1) return gb.toFixed(2) + " GB";
  const mb = n / (1024 ** 2); if (mb >= 1) return mb.toFixed(1) + " MB";
  return Math.round(n / 1024) + " KB";
}
function formatDate(iso) {
  if (!iso || iso === "forever" || iso === 0) return "∞";
  try { const d = new Date(iso * 1000); return isNaN(d.getTime()) ? "—" : d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch { return "—"; }
}

async function loadStatus() {
  const badge = document.getElementById("status-badge"); const errEl = document.getElementById("error");
  if (!tg || !tg.initData) {
    badge.className = "status-pill error"; badge.innerHTML = '<span class="status-dot"></span> Ошибка';
    errEl.innerHTML = 'Открой через бота.'; return;
  }
  try {
    const data = await apiFetch(`/api/status?initData=${encodeURIComponent(tg.initData)}`);
    if (data.active) { badge.className = "status-pill online"; badge.innerHTML = '<span class="status-dot"></span> Активна'; }
    else { badge.className = "status-pill offline"; badge.innerHTML = '<span class="status-dot"></span> Неактивна'; }
    document.getElementById("ui-expiry").textContent = formatDate(data.expiry);
    document.getElementById("ui-traffic").textContent = formatTraffic((Number(data.traffic_gb) || 0) * 1024 ** 3);
    errEl.innerHTML = "";
  } catch (e) {
    badge.className = "status-pill error"; badge.innerHTML = '<span class="status-dot"></span> Ошибка';
    errEl.innerHTML = e.message;
  }
}

const btn = document.getElementById("getKeysBtn");
const reissueBtn = document.getElementById("reissueBtn");
const section = document.getElementById("keysSection");
const errEl = document.getElementById("error");
const modal = document.getElementById("reissueModal");
let keysLoading = false;

function renderKeys(data) {
  toggleJsonButtons(data);
}

function toggleJsonButtons(data) {
  const map = {
    "my_private": data.cfg_my_private,
    "relay":      data.cfg_relay,
  };
  for (const [key, content] of Object.entries(map)) {
    const b = document.getElementById("json-" + key);
    if (!b) continue;
    if (content && content.length > 50) {
      b.style.display = "flex";
      b.dataset.json = content;
    } else {
      b.style.display = "none";
    }
  }
}

function downloadJson(key) {
  const b = document.getElementById("json-" + key);
  if (!b || !b.dataset.json) { showToast("❌ JSON ещё не готов"); return; }
  try { JSON.parse(b.dataset.json); } catch(e) { showToast("❌ JSON невалидный"); return; }
  
  const names = {
    "my_private": "DE-Osnovnoy.json",
    "relay":      "RU-Igrovoy.json",
  };
  
  const blob = new Blob([b.dataset.json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = names[key] || 'config.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  
  showToast("📥 " + (names[key] || 'JSON') + " скачан");
  haptic('notify');
}

document.querySelectorAll('.json-btn').forEach(b => {
  b.addEventListener('click', () => downloadJson(b.dataset.key));
});

async function fetchKeys(force = false) {
  keysLoading = true; errEl.innerHTML = "";
  btn.disabled = true; btn.textContent = "Загрузка...";
  haptic('impact');
  try {
    const forceParam = force ? "&force=true" : "";
    const data = await apiFetch(`/api/keys?initData=${encodeURIComponent(tg.initData)}${forceParam}`);
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
    renderKeys(data);
    section.classList.add("show");
    btn.textContent = "Ключи ниже 👇"; btn.disabled = false;
    section.scrollIntoView({ behavior: 'smooth' }); haptic('notify');
    if (force) showToast("✅ Ключи перевыпущены");
  } catch (e) {
    errEl.textContent = e.message; btn.disabled = false; btn.textContent = "Достать ключи"; haptic('error');
  } finally { keysLoading = false; }
}

btn.onclick = () => {
  if (keysLoading) return;
  if (!tg || !tg.initData) { errEl.innerHTML = 'Открой через Telegram.'; return; }
  fetchKeys(false);
};

reissueBtn.onclick = () => { if (keysLoading) return; modal.classList.add("show"); haptic('impact'); };
document.getElementById("cancelReissue").onclick = () => modal.classList.remove("show");
document.getElementById("confirmReissue").onclick = () => { modal.classList.remove("show"); fetchKeys(true); };

try {
  const raw = localStorage.getItem(CACHE_KEY);
  if (raw) {
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts < CACHE_TTL) {
      renderKeys(data);
      section.classList.add("show");
      btn.textContent = "Ключи ниже 👇";
    }
  }
} catch(e) {}

loadStatus();
if (tg && tg.initData) fetchKeys(false);
setInterval(loadStatus, 30000);
</script>
</body>
</html>
